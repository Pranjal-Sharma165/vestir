name: Python Tests

on:
  push:
    branches: [main, ci-tests]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      run_model_tests:
        description: "Also run real-model tests on sample images"
        type: boolean
        default: false
  schedule:
    - cron: "0 6 * * 1"   # weekly model check

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: python/requirements*.txt

      - name: Install application dependencies
        working-directory: python
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Install development dependencies
        working-directory: python
        run: pip install -r requirements-dev.txt

      - name: Run fast tests
        working-directory: python
        run: python -m pytest -v

  model-tests:
    if: github.event_name == 'schedule' || inputs.run_model_tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: python/requirements*.txt
      - name: Install dependencies
        working-directory: python
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt
      - name: Cache FashionCLIP weights
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: fashionclip-${{ runner.os }}-v1
      - name: Run real-model tests
        working-directory: python
        env:
          RUN_MODEL_TESTS: "1"
        run: python -m pytest -v -m model
        